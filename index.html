<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<title>Projects</title>
	
	<style>
		* {
			box-sizing: border-box;
		}
		
		html {
			font-size: 16px;
		}
		
		body {
			margin: 0;
			background: #f5f5f3;
			color: #222;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",	Roboto, Helvetica, Arial, sans-serif;
			line-height: 1.5;
		}
		
		main {
			width: min(900px, 90%);
			margin: 0 auto;
			padding: 80px 0;
		}
		
		header {
			margin-bottom: 60px;
		}
		
		h1 {
			margin: 0 0 12px;
			font-size: clamp(2.5rem, 7vw, 5rem);
			font-weight: 700;
			letter-spacing: -0.05em;
			line-height: 1;
		}
		
		header p {
			margin: 0;
			max-width: 600px;
			color: #666;
			font-size: 1.1rem;
		}
		
		.projects {
			display: grid;
			gap: 12px;
		}
		
		.project {
			display: block;
			padding: 28px 30px;
			border: 2px solid #222;
			background: #fff;
			color: inherit;
			text-decoration: none;
			transition: background-color 0.15s ease,
			color 0.15s ease;
		}
		
		.project:hover {
			background: #222;
			color: #fff;
		}
		
		.project-title {
			margin: 0 0 6px;
			font-size: 1.5rem;
			font-weight: 650;
		}
		
		.project-description {
			margin: 0;
			color: #777;
			font-size: 0.95rem;
		}
		
		.project:hover .project-description {
			color: #ccc;
		}
		
		footer {
			margin-top: 70px;
			padding-top: 20px;
			border-top: 1px solid #ccc;
			color: #888;
			font-size: 0.85rem;
		}
		
		@media (max-width: 600px) {
			main {
				padding: 50px 0;
			}
			
			header {
				margin-bottom: 40px;
			}
			
			.project {
				padding: 22px;
			}
		}
	</style>
</head>

<body>
	
	<main>
		<header>
			<h1>Mr. Zebell's Class</h1>
			<p>
				A collection of interactive programs, experiments, and other things.
			</p>
		</header>
		
		<section class="projects">
			
			<a class="project" href="./monty-hall/index.html">
				<h2 class="project-title">Monty Hall Simulation</h2>
				<p class="project-description">
					Play the Monty Hall problem or run thousands of trials
					to see the probability converge.
				</p>
			</a>
			
			<a class="project" href="./pong/game/index.html" style="display: none">
				<h2 class="project-title">Pong Program Tournament</h2>
				<p class="project-description">
					An online tournament for programs that play Pong.
				</p>
			</a>
			
		</section>
		
		<footer>
			&copy; 2026
		</footer>
	</main>
	
</body>
</html>
